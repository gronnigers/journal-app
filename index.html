<style>
:root {
  --bg:#faf8f5;--card:#fff;--text:#1c1a17;--sub:#8a8580;
  --accent:#c4953a;--al:rgba(196,149,58,.12);--am:rgba(196,149,58,.25);
  --danger:#ff3b30;--border:rgba(0,0,0,.07);
  --nav:rgba(250,248,245,.94);--chip:rgba(0,0,0,.05);
  --etrack:rgba(0,0,0,.08);--inp:#fff;
}
@media(prefers-color-scheme:dark){html:not([data-theme="light"]){
  --bg:#1c1814;--card:#2a2420;--text:#f5f0ea;--sub:#8a8580;
  --accent:#d4a84b;--al:rgba(212,168,75,.15);--am:rgba(212,168,75,.3);
  --border:rgba(255,255,255,.07);--nav:rgba(28,24,20,.94);
  --chip:rgba(255,255,255,.07);--etrack:rgba(255,255,255,.1);--inp:#2a2420;
}}
html[data-theme="dark"]{
  --bg:#1c1814;--card:#2a2420;--text:#f5f0ea;--sub:#8a8580;
  --accent:#d4a84b;--al:rgba(212,168,75,.15);--am:rgba(212,168,75,.3);
  --border:rgba(255,255,255,.07);--nav:rgba(28,24,20,.94);
  --chip:rgba(255,255,255,.07);--etrack:rgba(255,255,255,.1);--inp:#2a2420;
}
html[data-theme="light"]{
  --bg:#faf8f5;--card:#fff;--text:#1c1a17;--sub:#8a8580;
  --accent:#c4953a;--al:rgba(196,149,58,.12);--am:rgba(196,149,58,.25);
  --danger:#ff3b30;--border:rgba(0,0,0,.07);
  --nav:rgba(250,248,245,.94);--chip:rgba(0,0,0,.05);
  --etrack:rgba(0,0,0,.08);--inp:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding-bottom:calc(64px + env(safe-area-inset-bottom))}

/* AUTH */
.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:40px 24px;text-align:center}
.auth-icon{font-size:72px;margin-bottom:20px}
.auth-title{font-size:32px;font-weight:700;letter-spacing:-.7px;margin-bottom:8px}
.auth-sub{font-size:16px;color:var(--sub);margin-bottom:40px;line-height:1.6}
.auth-btn{background:var(--accent);color:#fff;border:none;border-radius:14px;padding:16px 44px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(196,149,58,.35)}
.auth-btn:active{opacity:.85}
.auth-err{color:#ff3b30;font-size:13px;margin-top:16px;max-width:300px}

/* HEADER */
.header{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;background:var(--nav);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-row{display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:28px;font-weight:700;letter-spacing:-.6px}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.icon-btn.accent{background:var(--accent);color:#fff}
.icon-btn.ghost{background:var(--chip);color:var(--sub)}
.icon-btn:active{opacity:.7}
.month-nav{display:flex;align-items:center;gap:4px;margin-top:10px}
.month-label{flex:1;text-align:center;font-size:15px;font-weight:600;color:var(--sub);letter-spacing:-.2px}
.nav-arrow{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
.nav-arrow:active{background:var(--chip)}
.nav-arrow:disabled{opacity:.3}

/* SETTINGS MENU */
.smenu{position:absolute;top:calc(100% + 6px);right:16px;z-index:30;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px;min-width:180px;box-shadow:0 8px 30px rgba(0,0,0,.18);opacity:0;pointer-events:none;transform:scale(.95) translateY(-4px);transform-origin:top right;transition:all .18s}
.smenu.open{opacity:1;pointer-events:all;transform:scale(1) translateY(0)}
.smenu-label{font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:6px 12px 2px}
.smenu-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:500;transition:background .12s}
.smenu-item:hover,.smenu-item:active{background:var(--chip)}
.smenu-item svg{width:18px;height:18px;color:var(--sub)}
.smenu-item.danger{color:#ff3b30}
.smenu-item.danger svg{color:#ff3b30}
.smenu-div{height:1px;background:var(--border);margin:4px 0}
.smenu-chk{margin-left:auto;color:var(--accent);font-size:16px;font-weight:700}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--nav);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;border:none;background:none;cursor:pointer;color:var(--sub);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-family:inherit;transition:color .15s}
.nav-tab.active{color:var(--accent)}
.nav-tab svg{width:22px;height:22px}

/* CONTENT */
.content{padding:16px}

/* ENTRY CARD */
.entry-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;border:1px solid var(--border);transition:transform .1s,box-shadow .1s;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.entry-card:active{transform:scale(.98);box-shadow:none}
.entry-date{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
.entry-summary{font-size:16px;font-weight:600;line-height:1.4;margin-bottom:7px;letter-spacing:-.2px}
.entry-preview{font-size:14px;color:var(--sub);line-height:1.55;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mood-chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--sub);text-transform:capitalize}
.energy-badge{font-size:11px;font-weight:600;color:var(--accent);background:var(--al);padding:3px 9px;border-radius:20px}
.theme-badge{font-size:11px;font-weight:600;color:#5856d6;background:rgba(88,86,214,.1);padding:3px 9px;border-radius:20px}

/* EMPTY STATE */
.empty-state{text-align:center;padding:80px 30px}
.empty-icon{font-size:56px;margin-bottom:16px}
.empty-title{font-size:20px;font-weight:700;margin-bottom:8px}
.empty-sub{font-size:15px;color:var(--sub);line-height:1.6;max-width:260px;margin:0 auto}

/* DETAIL MODAL */
.modal-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .22s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{background:var(--bg);width:100%;border-radius:22px 22px 0 0;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .3s cubic-bezier(.25,.46,.45,.94);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
.modal-header{padding:10px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-close{width:28px;height:28px;border-radius:50%;background:var(--chip);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:16px;flex-shrink:0}
.modal-date-label{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.modal-body{padding:14px 20px 0}
.modal-summary{font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:14px;line-height:1.3}
.modal-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px;background:var(--chip);color:var(--sub);text-transform:capitalize}
.chip.theme-chip{background:rgba(88,86,214,.1);color:#5856d6}
.chip.person-chip{background:rgba(52,199,89,.1);color:#2a9d47}
.energy-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.energy-label{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;min-width:50px}
.ebar-wrap{flex:1;height:6px;background:var(--etrack);border-radius:3px;overflow:hidden}
.ebar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .4s}
.energy-val{font-size:13px;font-weight:700;color:var(--accent);min-width:32px;text-align:right}
.modal-divider{height:1px;background:var(--border);margin:14px 0}
.modal-text{font-size:16px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:break-word}

/* ADD ENTRY MODAL */
.add-modal{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .3s cubic-bezier(.25,.46,.45,.94)}
.add-modal.open{transform:translateY(0)}
.add-header{position:sticky;top:0;background:var(--nav);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.add-title{font-size:17px;font-weight:700}
.btn-cancel{background:none;border:none;color:var(--sub);font-size:16px;cursor:pointer;font-family:inherit;padding:4px 0}
.btn-save{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-save:active{opacity:.8}
.add-form{padding:20px 20px calc(48px + env(safe-area-inset-bottom))}
.form-group{margin-bottom:20px}
.form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);margin-bottom:8px;display:block}
.form-input,.form-textarea{width:100%;background:var(--inp);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--text);font-family:inherit;outline:none;transition:border-color .15s;appearance:none;-webkit-appearance:none}
.form-input:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:100px;line-height:1.6}
.body-area{min-height:200px}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.eslider-row{display:flex;align-items:center;gap:12px}
.slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--etrack);border-radius:2px;outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.slider-val{font-size:18px;font-weight:700;color:var(--accent);min-width:24px;text-align:right}
.slider-edge{font-size:12px;color:var(--sub)}

/* INSIGHTS */
.insight-card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 1px 6px rgba(0,0,0,.05)}
.insight-title{font-size:14px;font-weight:700;margin-bottom:14px;letter-spacing:-.2px}
.stats-row{display:flex;gap:10px;margin-bottom:14px}
.stat-card{flex:1;background:var(--al);border-radius:14px;padding:14px 10px;text-align:center;border:1px solid var(--am)}
.stat-num{font-size:30px;font-weight:700;color:var(--accent);letter-spacing:-.5px;line-height:1}
.stat-label{font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.bar-label{font-size:12px;color:var(--text);min-width:90px;max-width:90px;text-align:right;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:8px;background:var(--etrack);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--accent)}
.bar-fill.blue{background:#5856d6}
.bar-count{font-size:12px;color:var(--sub);font-weight:600;min-width:18px;text-align:right}
.dow-chart{display:flex;align-items:flex-end;gap:6px;height:72px}
.dow-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.dow-bar{width:100%;border-radius:4px 4px 0 0;background:var(--accent);min-height:4px}
.dow-lbl{font-size:10px;color:var(--sub);font-weight:600}
.chart-wrap{width:100%;overflow:hidden}

/* PEOPLE */
.person-card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);box-shadow:0 1px 6px rgba(0,0,0,.05);cursor:pointer;display:flex;align-items:center;gap:14px;transition:transform .1s}
.person-card:active{transform:scale(.98)}
.person-avatar{width:46px;height:46px;border-radius:50%;flex-shrink:0;background:var(--al);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--accent);border:1.5px solid var(--am)}
.person-info{flex:1;min-width:0}
.person-name{font-size:16px;font-weight:600;letter-spacing:-.2px}
.person-rel{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-badge{font-size:11px;font-weight:700;color:var(--accent);background:var(--al);padding:4px 10px;border-radius:20px;flex-shrink:0}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:60px 20px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(12px);background:rgba(28,26,22,.9);color:#fff;border-radius:22px;padding:10px 20px;font-size:14px;font-weight:500;white-space:nowrap;pointer-events:none;z-index:99;opacity:0;transition:all .22s;backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen" class="auth-screen" style="display:none">
  <div class="auth-icon">📖</div>
  <div class="auth-title">Journal</div>
  <div class="auth-sub">Connect to OneDrive to access<br>your journal entries.</div>
  <button class="auth-btn" onclick="login()">Sign in with Microsoft</button>
  <div id="authError" class="auth-err"></div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;position:relative">
  <div class="header" id="mainHeader">
    <div class="header-row">
      <div class="header-title">Journal</div>
      <div class="header-actions">
        <button class="icon-btn ghost" onclick="toggleMenu()" id="menuBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </button>
        <button class="icon-btn accent" onclick="openAddModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>
    <div class="month-nav" id="monthNav" style="display:none">
      <button class="nav-arrow" onclick="changeMonth(-1)">&#8249;</button>
      <div class="month-label" id="monthLabel">May 2026</div>
      <button class="nav-arrow" onclick="changeMonth(1)" id="nextBtn">&#8250;</button>
    </div>
    <!-- Settings dropdown -->
    <div class="smenu" id="smenu">
      <div class="smenu-label">Theme</div>
      <div class="smenu-item" onclick="setTheme('auto')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20z"/></svg>Auto<span class="smenu-chk" id="chk-auto">&#10003;</span></div>
      <div class="smenu-item" onclick="setTheme('light')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>Light<span class="smenu-chk" id="chk-light" style="display:none">&#10003;</span></div>
      <div class="smenu-item" onclick="setTheme('dark')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>Dark<span class="smenu-chk" id="chk-dark" style="display:none">&#10003;</span></div>
      <div class="smenu-div"></div>
      <div class="smenu-item danger" onclick="signOut()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out</div>
    </div>
  </div>

  <div id="contentArea"></div>

  <div class="bottom-nav">
    <button class="nav-tab active" id="tab-entries" onclick="switchTab('entries')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Entries
    </button>
    <button class="nav-tab" id="tab-insights" onclick="switchTab('insights')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Insights
    </button>
    <button class="nav-tab" id="tab-people" onclick="switchTab('people')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      People
    </button>

<script>
// CONFIG
const CONFIG={CLIENT_ID:'79dffb14-01e3-4e4d-bc16-c7e86981106f',TENANT:'0ae860f2-b1e0-4222-b0e1-37314eddf4df',SCOPES:'Files.ReadWrite offline_access'};
const REDIRECT_URI=location.origin+location.pathname;

// STATE
let accessToken=null,currentTab='entries',currentYM='',monthCache={},allEntries=[],aggrEntries=[],peopleList=[],peopleLoaded=false;

// THEME

// TOAST
let toastTimer=null;

// PKCE AUTH
function b64u(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');}
async function genPKCE(){const v=b64u(crypto.getRandomValues(new Uint8Array(32)));const c=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));return{verifier:v,challenge:c};}
async function login(){const{verifier,challenge}=await genPKCE();const state=b64u(crypto.getRandomValues(new Uint8Array(16)));localStorage.setItem('j_pkv',verifier);localStorage.setItem('j_pks',state);const p=new URLSearchParams({client_id:CONFIG.CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,scope:CONFIG.SCOPES,code_challenge:challenge,code_challenge_method:'S256',state});location.href=`https://login.microsoftonline.com/${CONFIG.TENANT}/oauth2/v2.0/authorize?${p}`;}
async function exchangeCode(code,rs){const v=localStorage.getItem('j_pkv');const ss=localStorage.getItem('j_pks');if(!v)return false;if(ss&&rs&&ss!==rs)return false;try{const res=await fetch(`https://login.microsoftonline.com/${CONFIG.TENANT}/oauth2/v2.0/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CONFIG.CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:v})});const d=await res.json();if(d.access_token){accessToken=d.access_token;localStorage.setItem('j_tok',accessToken);if(d.refresh_token)localStorage.setItem('j_ref',d.refresh_token);localStorage.removeItem('j_pkv');localStorage.removeItem('j_pks');history.replaceState({},'',location.pathname);return true;}return false;}catch{return false;}}
async function refreshToken(){const rt=localStorage.getItem('j_ref');if(!rt)return false;try{const res=await fetch(`https://login.microsoftonline.com/${CONFIG.TENANT}/oauth2/v2.0/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CONFIG.CLIENT_ID,grant_type:'refresh_token',refresh_token:rt,scope:CONFIG.SCOPES})});const d=await res.json();if(d.access_token){accessToken=d.access_token;localStorage.setItem('j_tok',accessToken);if(d.refresh_token)localStorage.setItem('j_ref',d.refresh_token);return true;}return false;}catch{return false;}}
function signOut(){accessToken=null;localStorage.removeItem('j_tok');localStorage.removeItem('j_ref');closeMenu();showAuthScreen();}

// GRAPH
async function gF(url,opts={}){const tok=accessToken||localStorage.getItem('j_tok');if(!tok){showAuthScreen();return null;}if(!accessToken)accessToken=tok;const res=await fetch('https://graph.microsoft.com/v1.0'+url,{...opts,headers:{Authorization:'Bearer '+accessToken,...(opts.headers||{})}});if(res.status===401){const ok=await refreshToken();if(ok)return gF(url,opts);signOut();return null;}return res;}

// DATA
async function loadMonth(ym){if(ym in monthCache)return monthCache[ym];const res=await gF(JP(ym));if(!res||res.status===404){monthCache[ym]=null;return null;}if(!res.ok){monthCache[ym]=null;return null;}const t=await res.text();monthCache[ym]=t;return t;}
async function saveMonth(ym){const md=monthCache[ym];if(md==null)return;showToast('Saving…');const res=await gF(JP(ym),{method:'PUT',headers:{'Content-Type':'text/plain'},body:md});if(res&&res.ok)showToast('✓ Saved');else if(res)showToast('⚠️ Save failed ('+res.status+')');}
async function loadPeople(){if(peopleLoaded)return;const res=await gF(PPL_PATH);if(!res||!res.ok){peopleLoaded=true;return;}const raw=await res.text();peopleList=parsePeople(raw);peopleLoaded=true;}

function warmCache(){const now=new Date();for(let i=1;i<=6;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const ym=toYM(d);if(!(ym in monthCache))loadMonth(ym).then(()=>rebuildAggr());}}
function rebuildAggr(){const seen=new Set();aggrEntries=[];for(const[,raw]of Object.entries(monthCache)){if(!raw)continue;for(const e of parseMonth(raw)){const k=e.dateStr+'|'+e.timeStr;if(!seen.has(k)){seen.add(k);aggrEntries.push(e);}}}aggrEntries.sort((a,b)=>(b.date||0)-(a.date||0));}

// PARSE
function toYM(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function ymLabel(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});}
function parseJDate(dateStr,timeStr){try{const bare=dateStr.replace(/^[A-Za-z]+,\s*/,'');return new Date(bare+' '+timeStr);}catch{return null;}}

function parseMonth(raw){if(!raw)return[];const lines=raw.split('\n');const entries=[];let curDate=null,inE=false,etime='',elines=[];function flush(){if(!inE||!curDate)return;const e=buildEntry(curDate,etime,elines);if(e)entries.push(e);inE=false;elines=[];}for(const line of lines){const dm=line.match(/^## ([A-Za-z].*\d{4})/);if(dm){flush();curDate=dm[1].trim();continue;}const tm=line.match(/^### (.+)/);if(tm){flush();etime=tm[1].trim();inE=true;elines=[];continue;}if(inE)elines.push(line);}flush();return entries.sort((a,b)=>(b.date||0)-(a.date||0));}

function buildEntry(dateStr,timeStr,lines){const e={dateStr,timeStr,date:parseJDate(dateStr,timeStr),summary:'',mood:[],energy:null,themes:[],people:[],body:''};let metaDone=false;const body=[];for(const line of lines){if(line.trim()==='---')continue;if(!metaDone){const mm=line.match(/^\*\*(\w+):\*\*\s*(.+)/);if(mm){const k=mm[1].toLowerCase(),v=mm[2].trim();if(k==='summary')e.summary=v;else if(k==='mood')e.mood=v.split(',').map(s=>s.trim()).filter(Boolean);else if(k==='energy')e.energy=parseInt(v)||null;else if(k==='themes')e.themes=v.split(',').map(s=>s.trim()).filter(Boolean);else if(k==='people')e.people=v.split(',').map(s=>s.trim()).filter(Boolean);continue;}if(line.trim())metaDone=true;}if(metaDone)body.push(line);}while(body.length&&!body[body.length-1].trim())body.pop();while(body.length&&!body[0].trim())body.shift();e.body=body.join('\n');if(!e.summary&&!e.body&&!e.mood.length)return null;return e;}

function parsePeople(raw){if(!raw)return[];const out=[];const secs=raw.split(/^---$/m);for(const sec of secs){const nm=sec.match(/^## (.+)$/m);if(!nm)continue;const name=nm[1].trim();const rm=sec.match(/^\*\*Relationship:\*\*\s*(.+)$/m);const sm=sec.match(/^\*\*Summary:\*\*\s*([\s\S]+?)(?=\n\*\*|\n$)/m);const mentions=(sec.match(/^\- \[/gm)||[]).length;out.push({name,rel:rm?rm[1].trim():'',summary:sm?sm[1].trim():'',mentions});}return out.sort((a,b)=>b.mentions-a.mentions);}

// TABS
function switchTab(tab){currentTab=tab;['entries','insights','people'].forEach(t=>{document.getElementById('tab-'+t).classList.toggle('active',t===tab);});document.getElementById('monthNav').style.display=tab==='entries'?'flex':'none';renderContent();}
async function renderContent(){if(currentTab==='entries')renderEntries();else if(currentTab==='insights')renderInsights();else if(currentTab==='people')await renderPeople();}

// ENTRIES
async function loadAndRender(){const c=document.getElementById('contentArea');c.innerHTML='<div class="loading"><div class="spinner"></div></div>';const raw=await loadMonth(currentYM);allEntries=parseMonth(raw);rebuildAggr();warmCache();renderEntries();}

function renderEntries(){const c=document.getElementById('contentArea');if(!allEntries.length){c.innerHTML=`<div class="empty-state"><div class="empty-icon">✍️</div><div class="empty-title">No entries yet</div><div class="empty-sub">Tap <strong>+</strong> to write your first entry for ${ymLabel(currentYM)}.</div></div>`;return;}let html='<div class="content">';allEntries.forEach((e,i)=>html+=cardHTML(e,i));html+='</div>';c.innerHTML=html;c.querySelectorAll('.entry-card').forEach((card,i)=>card.addEventListener('click',()=>openDetail(allEntries[i])));}

function cardHTML(e){const dl=fmtDate(e.dateStr)+(e.timeStr?'  ·  '+e.timeStr:'');const moods=e.mood.slice(0,3).map(m=>`<span class="mood-chip">${esc(m)}</span>`).join('');const en=e.energy?`<span class="energy-badge">⚡ ${e.energy}/10</span>`:'';const th=e.themes.length?`<span class="theme-badge">🏷 ${e.themes.slice(0,2).map(esc).join(', ')}</span>`:'';const preview=e.body?e.body.replace(/\n+/g,' ').slice(0,150):'';return `<div class="entry-card"><div class="entry-date">${esc(dl)}</div>${e.summary?`<div class="entry-summary">${esc(e.summary)}</div>`:''} ${preview?`<div class="entry-preview">${esc(preview)}</div>`:''}<div class="entry-meta">${moods}${en}${th}</div></div>`;}

function fmtDate(s){if(!s)return'';try{const d=new Date(s.replace(/^[A-Za-z]+,\s*/,''));if(isNaN(d))return s;return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}catch{return s;}}

// MONTH NAV
async function changeMonth(delta){const[y,m]=currentYM.split('-').map(Number);const d=new Date(y,m-1+delta,1);const nym=toYM(d);if(nym>toYM(new Date()))return;currentYM=nym;document.getElementById('monthLabel').textContent=ymLabel(currentYM);document.getElementById('nextBtn').disabled=currentYM>=toYM(new Date());await loadAndRender();}

// DETAIL MODAL
function openDetail(entry){const overlay=document.getElementById('detailOverlay');document.getElementById('detailDateLabel').textContent=(entry.dateStr||'')+(entry.timeStr?'  ·  '+entry.timeStr:'');let html='';if(entry.summary)html+=`<div class="modal-summary">${esc(entry.summary)}</div>`;const chips=[...entry.mood.map(m=>`<span class="chip">${esc(m)}</span>`),...entry.themes.map(t=>`<span class="chip theme-chip">${esc(t)}</span>`),...entry.people.map(p=>`<span class="chip person-chip">${esc(p)}</span>`)];if(chips.length)html+=`<div class="modal-chips">${chips.join('')}</div>`;if(entry.energy){const pct=Math.round((entry.energy/10)*100);html+=`<div class="energy-row"><span class="energy-label">Energy</span><div class="ebar-wrap"><div class="ebar-fill" style="width:${pct}%"></div></div><span class="energy-val">${entry.energy}/10</span></div>`;}if(entry.body)html+=`<div class="modal-divider"></div><div class="modal-text">${esc(entry.body)}</div>`;document.getElementById('detailBody').innerHTML=html;overlay.classList.add('open');document.body.style.overflow='hidden';}
function overlayTap(e){if(e.target===document.getElementById('detailOverlay'))closeDetail();}
function closeDetail(){document.getElementById('detailOverlay').classList.remove('open');document.body.style.overflow='';}

// ADD MODAL
function openAddModal(){const now=new Date();document.getElementById('addDate').value=now.toISOString().slice(0,10);document.getElementById('addTime').value=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');['addSummary','addBody','addMood','addThemes','addPeople'].forEach(id=>document.getElementById(id).value='');document.getElementById('addEnergy').value=7;document.getElementById('energyDisplay').textContent='7';document.getElementById('addModal').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>document.getElementById('addBody').focus(),350);}
function closeAddModal(){document.getElementById('addModal').classList.remove('open');document.body.style.overflow='';}

async function saveNewEntry(){const dateVal=document.getElementById('addDate').value;const timeVal=document.getElementById('addTime').value;const summary=document.getElementById('addSummary').value.trim();const body=document.getElementById('addBody').value.trim();const moodRaw=document.getElementById('addMood').value.trim();const energy=document.getElementById('addEnergy').value;const themesRaw=document.getElementById('addThemes').value.trim();const pplRaw=document.getElementById('addPeople').value.trim();if(!body&&!summary){showToast('Write something first ✏️');return;}const dObj=new Date(dateVal+'T12:00:00');const dayName=dObj.toLocaleDateString('en-US',{weekday:'long'});const monName=dObj.toLocaleDateString('en-US',{month:'long'});const dateStr=`${dayName}, ${monName} ${dObj.getDate()}, ${dObj.getFullYear()}`;const[h,mi]=timeVal.split(':').map(Number);const ampm=h>=12?'PM':'AM';const h12=h%12||12;const timeStr=`${h12}:${String(mi).padStart(2,'0')} ${ampm}`;let block=`### ${timeStr}\n\n`;if(summary)block+=`**Summary:** ${summary}\n`;if(moodRaw)block+=`**Mood:** ${moodRaw}\n`;block+=`**Energy:** ${energy}/10\n`;if(themesRaw)block+=`**Themes:** ${themesRaw}\n`;if(pplRaw)block+=`**People:** ${pplRaw}\n`;if(body)block+=`\n${body}\n`;const ym=dateVal.slice(0,7);let existing=monthCache[ym];if(existing===undefined)existing=await loadMonth(ym)||'';const dayHeader=`## ${dateStr}`;if(existing&&existing.includes(dayHeader)){const si=existing.indexOf(dayHeader);const ni=existing.indexOf('\n## ',si+dayHeader.length);const insertAt=ni===-1?existing.length:ni;const ins='\n\n---\n\n'+block;existing=existing.slice(0,insertAt)+ins+(ni===-1?'':existing.slice(insertAt));}else{if(existing&&existing.trim())existing=existing.trimEnd()+'\n\n---\n\n';existing+=`${dayHeader}\n\n${block}`;}monthCache[ym]=existing;if(ym===currentYM){allEntries=parseMonth(existing);rebuildAggr();}closeAddModal();if(ym!==currentYM){currentYM=ym;document.getElementById('monthLabel').textContent=ymLabel(currentYM);allEntries=parseMonth(existing);rebuildAggr();}renderEntries();await saveMonth(ym);}

// INSIGHTS
function renderInsights(){const c=document.getElementById('contentArea');const seen=new Set();const all=[];for(const e of[...allEntries,...aggrEntries]){const k=e.dateStr+'|'+e.timeStr;if(!seen.has(k)){seen.add(k);all.push(e);}}all.sort((a,b)=>(a.date||0)-(b.date||0));if(!all.length){c.innerHTML=`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No data yet</div><div class="empty-sub">Write some entries and your insights will appear here.</div></div>`;return;}const wE=all.filter(e=>e.energy);const mf=freqMap(all.flatMap(e=>e.mood));const tf=freqMap(all.flatMap(e=>e.themes));const tw=all.reduce((n,e)=>n+(e.body?e.body.split(/\s+/).filter(Boolean).length:0),0);const streak=calcStreak(all);let html='<div class="content">';html+=`<div class="stats-row"><div class="stat-card"><div class="stat-num">${all.length}</div><div class="stat-label">Entries</div></div><div class="stat-card"><div class="stat-num">${streak}</div><div class="stat-label">Day streak</div></div><div class="stat-card"><div class="stat-num">${tw>999?(tw/1000).toFixed(1)+'k':tw}</div><div class="stat-label">Words</div></div></div>`;
if(wE.length>=2)html+=`<div class="insight-card"><div class="insight-title">Energy Over Time</div>${energySVG(wE)}</div>`;
const topM=Object.entries(mf).sort((a,b)=>b[1]-a[1]).slice(0,10);if(topM.length){const mx=topM[0][1];html+=`<div class="insight-card"><div class="insight-title">Mood Frequency</div>`;topM.forEach(([m,n])=>{html+=`<div class="bar-row"><div class="bar-label">${esc(m)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/mx*100)}%"></div></div><div class="bar-count">${n}</div></div>`;});html+='</div>';}
const topT=Object.entries(tf).sort((a,b)=>b[1]-a[1]).slice(0,10);if(topT.length){const mx=topT[0][1];html+=`<div class="insight-card"><div class="insight-title">Top Themes</div>`;topT.forEach(([t,n])=>{html+=`<div class="bar-row"><div class="bar-label">${esc(t)}</div><div class="bar-track"><div class="bar-fill blue" style="width:${Math.round(n/mx*100)}%"></div></div><div class="bar-count">${n}</div></div>`;});html+='</div>';}
const dow=[0,0,0,0,0,0,0];all.forEach(e=>{if(e.date)dow[e.date.getDay()]++;});const maxD=Math.max(...dow,1);const dowL=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];html+=`<div class="insight-card"><div class="insight-title">Most Active Days</div><div class="dow-chart">`;dow.forEach((cnt,i)=>{const h=Math.max(Math.round(cnt/maxD*60),cnt?4:0);html+=`<div class="dow-col"><div style="flex:1;display:flex;align-items:flex-end;width:100%"><div class="dow-bar" style="height:${h}px;opacity:${cnt?1:0.15}"></div></div><div class="dow-lbl">${dowL[i]}</div></div>`;});html+='</div></div>';
html+='</div>';c.innerHTML=html;}

function energySVG(entries){const W=300,H=90,PX=12,PY=10,n=entries.length;const pts=entries.map((e,i)=>[PX+(i/(n-1))*(W-2*PX),H-PY-((e.energy-1)/9)*(H-2*PY)]);let d=`M ${pts[0].join(' ')}`;for(let i=1;i<pts.length;i++){const[x0,y0]=pts[i-1],[x1,y1]=pts[i];const cx=(x0+x1)/2;d+=` C ${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`;}const fill=d+` L ${pts[pts.length-1][0]} ${H} L ${pts[0][0]} ${H} Z`;const dots=pts.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--accent)"/>`).join('');const yg=[1,5,10].map(v=>{const y=(H-PY-((v-1)/9)*(H-2*PY)).toFixed(1);return`<text x="0" y="${y}" dy="4" font-size="9" fill="var(--sub)" font-family="-apple-system,sans-serif">${v}</text>`;}).join('');return`<div class="chart-wrap"><svg viewBox="-10 0 ${W+10} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible"><defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${yg}<path d="${fill}" fill="url(#eg)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>${dots}</svg></div>`;}

function freqMap(arr){const f={};arr.forEach(w=>{if(w){const k=w.toLowerCase().trim();f[k]=(f[k]||0)+1;}});return f;}
function calcStreak(entries){const days=new Set(entries.filter(e=>e.date).map(e=>e.date.toDateString()));let s=0;const d=new Date();d.setHours(12,0,0,0);while(days.has(d.toDateString())){s++;d.setDate(d.getDate()-1);}return s;}

// PEOPLE
async function renderPeople(){const c=document.getElementById('contentArea');if(!peopleLoaded){c.innerHTML='<div class="loading"><div class="spinner"></div></div>';await loadPeople();}if(!peopleList.length){c.innerHTML=`<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-title">No people yet</div><div class="empty-sub">People mentioned in your journal will appear here.</div></div>`;return;}const seen=new Set();const allE=[];for(const e of[...allEntries,...aggrEntries]){const k=e.dateStr+'|'+e.timeStr;if(!seen.has(k)){seen.add(k);allE.push(e);}}const counts={};allE.forEach(e=>e.people.forEach(p=>{const name=p.replace(/^@/,'').trim();counts[name]=(counts[name]||0)+1;}));const list=peopleList.map(p=>({...p,live:counts[p.name]||p.mentions||0})).sort((a,b)=>b.live-a.live);let html='<div class="content">';list.forEach(p=>{const init=p.name.split(' ').map(n=>n[0]||'').join('').slice(0,2).toUpperCase();const cnt=p.live;html+=`<div class="person-card" onclick="openPersonDetail(${JSON.stringify(p.name)})"><div class="person-avatar">${init}</div><div class="person-info"><div class="person-name">${esc(p.name)}</div><div class="person-rel">${esc(p.rel)}</div></div>${cnt?`<div class="person-badge">${cnt} ${cnt===1?'entry':'entries'}</div>`:''}</div>`;});html+='</div>';c.innerHTML=html;}

function openPersonDetail(name){const person=peopleList.find(p=>p.name===name);const init=name.split(' ').map(n=>n[0]||'').join('').slice(0,2).toUpperCase();const seen=new Set();const allE=[];for(const e of[...allEntries,...aggrEntries]){const k=e.dateStr+'|'+e.timeStr;if(!seen.has(k)){seen.add(k);allE.push(e);}}const mentions=allE.filter(e=>e.people.some(p=>p.replace(/^@/,'').trim().toLowerCase()===name.toLowerCase())||(e.body&&e.body.toLowerCase().includes(name.toLowerCase()))).sort((a,b)=>(b.date||0)-(a.date||0));const overlay=document.getElementById('detailOverlay');document.getElementById('detailDateLabel').innerHTML=`<div style="display:flex;align-items:center;gap:10px"><div style="width:34px;height:34px;border-radius:50%;background:var(--al);border:1.5px solid var(--am);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent)">${init}</div><div><div style="font-size:16px;font-weight:700;color:var(--text);text-transform:none;letter-spacing:normal">${esc(name)}</div>${person?`<div style="font-size:12px;color:var(--sub);font-weight:400;text-transform:none;letter-spacing:normal">${esc(person.rel)}</div>`:''}</div></div>`;let html='';if(person&&person.summary)html+=`<div style="font-size:14px;color:var(--sub);line-height:1.65;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)">${esc(person.summary)}</div>`;if(mentions.length){html+=`<div class="modal-chips" style="margin-bottom:14px"><span class="chip">${mentions.length} journal ${mentions.length===1?'entry':'entries'}</span></div>`;mentions.slice(0,12).forEach((e,i)=>{html+=`<div class="entry-card" data-idx="${i}"><div class="entry-date">${esc(fmtDate(e.dateStr))}</div>${e.summary?`<div class="entry-summary">${esc(e.summary)}</div>`:''} ${e.body?`<div class="entry-preview">${esc(e.body.replace(/\n+/g,' ').slice(0,120))}</div>`:''}</div>`;});}else{html+=`<div style="color:var(--sub);font-size:14px">No entries found mentioning ${esc(name)} yet.</div>`;}document.getElementById('detailBody').innerHTML=html;overlay.classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>{overlay.querySelectorAll('.entry-card[data-idx]').forEach(card=>{const idx=parseInt(card.dataset.idx);card.onclick=()=>{closeDetail();setTimeout(()=>openDetail(mentions[idx]),60);};});},20);}

// UTILS
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// SCREENS
function showAuthScreen(){document.getElementById('authScreen').style.display='flex';document.getElementById('app').style.display='none';}
function showApp(){document.getElementById('authScreen').style.display='none';document.getElementById('app').style.display='block';}

// INIT
async function init(){const params=new URLSearchParams(location.search);const code=params.get('code');const state=params.get('state');if(code){const ok=await exchangeCode(code,state);if(!ok){showAuthScreen();document.getElementById('authError').textContent='Sign-in failed. Please try again.';return;}}accessToken=localStorage.getItem('j_tok');if(!accessToken){showAuthScreen();return;}await refreshToken().catch(()=>{});showApp();currentYM=toYM(new Date());document.getElementById('monthLabel').textContent=ymLabel(currentYM);document.getElementById('monthNav').style.display='flex';document.getElementById('nextBtn').disabled=true;loadPeople();await loadAndRender();}
init();
</script>
</body>
