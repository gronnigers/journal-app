<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ─── State ────────────────────────────────────────────────────────────────────
let currentYear, currentMonth, parsedEntries = [], activeTab = 'entries';
let selectedFile = null, uploadedPhotoPath = null;
let energyChart = null;

const MOODS = ['happy','grateful','content','excited','nostalgic','reflective',
               'anxious','tired','frustrated','sad','stressed','motivated'];

// ─── Auth helpers ─────────────────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
}
function getRedirectUri() { return window.location.origin + window.location.pathname; }
function showLogin() {
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app-screen').classList.add('hidden');
}
function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
}
function randomBase64url(len) {
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function sha256base64url(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function signIn() {
  const verifier = randomBase64url(64);
  const challenge = await sha256base64url(verifier);
  localStorage.setItem('pkce_v', verifier);
  const params = new URLSearchParams({
    client_id: CONFIG.CLIENT_ID, response_type: 'code',
    redirect_uri: getRedirectUri(), scope: CONFIG.SCOPES,
    code_challenge: challenge, code_challenge_method: 'S256', response_mode: 'query'
  });
  window.location.href = `https://login.microsoftonline.com/${CONFIG.TENANT_ID}/oauth2/v2.0/authorize?` + params;
}
function signOut() {
  ['access_token','refresh_token','token_expires'].forEach(k => localStorage.removeItem(k));
  showLogin();
}
async function exchangeCode(code) {
  const verifier = localStorage.getItem('pkce_v');
  if (!verifier) throw new Error('No PKCE verifier');
  const body = new URLSearchParams({ client_id: CONFIG.CLIENT_ID, grant_type: 'authorization_code',
    code, redirect_uri: getRedirectUri(), code_verifier: verifier, scope: CONFIG.SCOPES });
  const res = await fetch(`https://login.microsoftonline.com/${CONFIG.TENANT_ID}/oauth2/v2.0/token`,
    { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body.toString() });
  const data = await res.json();
  if (data.error) throw new Error(data.error + ': ' + data.error_description);
  localStorage.setItem('access_token', data.access_token);
  if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
  localStorage.setItem('token_expires', Date.now() + data.expires_in * 1000);
  localStorage.removeItem('pkce_v');
}
async function getToken() {
  const expires = parseInt(localStorage.getItem('token_expires') || '0');
  if (localStorage.getItem('access_token') && Date.now() < expires - 60000)
    return localStorage.getItem('access_token');
  const rt = localStorage.getItem('refresh_token');
  if (!rt) throw new Error('No refresh token');
  const body = new URLSearchParams({ client_id: CONFIG.CLIENT_ID, grant_type: 'refresh_token',
    refresh_token: rt, scope: CONFIG.SCOPES });
  const res = await fetch(`https://login.microsoftonline.com/${CONFIG.TENANT_ID}/oauth2/v2.0/token`,
    { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body.toString() });
  const data = await res.json();
  if (data.error) throw new Error(data.error_description);
  localStorage.setItem('access_token', data.access_token);
  if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
  localStorage.setItem('token_expires', Date.now() + data.expires_in * 1000);
  return data.access_token;
}

// ─── OneDrive ─────────────────────────────────────────────────────────────────
async function readFile(path) {
  const token = await getToken();
  const res = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${path}:/content`,
    { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.text();
}
async function writeFile(path, content) {
  const token = await getToken();
  const res = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${path}:/content`,
    { method:'PUT', headers:{ Authorization:'Bearer '+token, 'Content-Type':'text/plain' }, body: content });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' writing file');
}
async function uploadBinaryFile(path, arrayBuffer, mimeType) {
  const token = await getToken();
  const res = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${path}:/content`,
    { method:'PUT', headers:{ Authorization:'Bearer '+token, 'Content-Type': mimeType }, body: arrayBuffer });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' uploading file');
  return await res.json();
}
async function fetchImageBlob(path) {
  const token = await getToken();
  const res = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${path}:/content`,
    { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) return null;
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}

// ─── Parser ───────────────────────────────────────────────────────────────────
function parseJournal(rawMd) {
  if (!rawMd) return [];
  const days = [];
  let currentDay = null, currentEntry = null;
  const lines = rawMd.split('\n');

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    // Day header: ## Weekday, Month DD, YYYY
    const dayMatch = line.match(/^## (.+?, .+? \d+, \d{4})/);
    if (dayMatch) {
      currentDay = { date: dayMatch[1], entries: [] };
      days.push(currentDay);
      currentEntry = null;
      continue;
    }
    // Entry time: ### HH:MM AM/PM
    const timeMatch = line.match(/^### (\d{1,2}:\d{2}\s*[AP]M)/i);
    if (timeMatch && currentDay) {
      currentEntry = { time: timeMatch[1], summary:'', mood:[], energy:null, themes:[], people:[], body:'', photo:null };
      currentDay.entries.push(currentEntry);
      continue;
    }
    if (!currentEntry) continue;
    // Structured fields
    const summaryMatch = line.match(/^\*\*Summary:\*\*\s*(.+)/);
    if (summaryMatch) { currentEntry.summary = summaryMatch[1].trim(); continue; }
    const moodMatch = line.match(/^\*\*Mood:\*\*\s*(.+)/);
    if (moodMatch) { currentEntry.mood = moodMatch[1].split(',').map(m => m.trim()).filter(Boolean); continue; }
    const energyMatch = line.match(/^\*\*Energy:\*\*\s*(\d+)/);
    if (energyMatch) { currentEntry.energy = parseInt(energyMatch[1]); continue; }
    const themesMatch = line.match(/^\*\*Themes:\*\*\s*(.+)/);
    if (themesMatch) { currentEntry.themes = themesMatch[1].split(',').map(t => t.trim()).filter(Boolean); continue; }
    const peopleMatch = line.match(/^\*\*People:\*\*\s*(.+)/);
    if (peopleMatch) { currentEntry.people = peopleMatch[1].split(',').map(p => p.trim()).filter(Boolean); continue; }
    // Photo reference: ![...](filename)
    const photoMatch = line.match(/!\[.*?\]\((.+?)\)/);
    if (photoMatch) { currentEntry.photo = photoMatch[1]; continue; }
    // Body text (skip separators and blank lines at start)
    if (line === '---') continue;
    if (line.startsWith('**')) continue;
    if (currentEntry.body === '' && line.trim() === '') continue;
    currentEntry.body += (currentEntry.body ? '\n' : '') + line;
  }
  // Trim trailing whitespace from bodies
  days.forEach(d => d.entries.forEach(e => { e.body = e.body.trim(); }));
  return days;
}

function journalPath(year, month) {
  const mm = String(month).padStart(2, '0');
  return `${CONFIG.JOURNAL_BASE}/${year}-${mm}.md`;
}

function monthLabel(year, month) {
  return new Date(year, month - 1, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
}

// ─── Load & Render ────────────────────────────────────────────────────────────
async function loadMonth(year, month) {
  currentYear = year; currentMonth = month;
  document.getElementById('month-nav-title').textContent = monthLabel(year, month);
  document.getElementById('subtitle').textContent = monthLabel(year, month);
  document.getElementById('content').innerHTML = '<div class="loading-state">Loading…</div>';
  try {
    const raw = await readFile(journalPath(year, month));
    parsedEntries = parseJournal(raw);
    render();
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty-state">Could not load journal.<br><small>' + e.message + '</small></div>';
  }
}

function render() {
  if (activeTab === 'entries') renderEntries();
  else if (activeTab === 'today') renderToday();
  else if (activeTab === 'insights') renderInsights();
}

function renderEntries() {
  const content = document.getElementById('content');
  if (!parsedEntries.length) {
    content.innerHTML = '<div class="empty-state">No entries for this month yet.</div>';
    return;
  }
  let html = '';
  [...parsedEntries].reverse().forEach(day => {
    if (!day.entries.length) return;
    html += `<div class="day-group"><div class="day-header">${day.date}</div>`;
    [...day.entries].reverse().forEach(entry => {
      html += `<div class="entry-card" onclick="openEntry('${esc(day.date)}','${esc(entry.time)}')">`;
      html += `<div class="entry-time">${entry.time}</div>`;
      if (entry.summary) html += `<div class="entry-summary">${esc(entry.summary)}</div>`;
      if (entry.body) html += `<div class="entry-body">${esc(entry.body)}</div>`;
      html += `<div class="entry-meta">`;
      entry.mood.slice(0,3).forEach(m => html += `<span class="meta-pill mood-pill">${esc(m)}</span>`);
      entry.themes.slice(0,3).forEach(t => html += `<span class="meta-pill theme-pill">${esc(t)}</span>`);
      if (entry.energy) html += `<span class="meta-pill energy-pill">⚡ ${entry.energy}/10</span>`;
      html += `</div>`;
      if (entry.photo) html += `<div style="margin-top:8px;font-size:12px;color:var(--text3)">📷 Photo attached</div>`;
      html += `</div>`;
    });
    html += `</div>`;
  });
  content.innerHTML = html;
}

function renderToday() {
  const today = new Date();
  const todayStr = today.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  const todayDay = parsedEntries.find(d => d.date === todayStr);
  const content = document.getElementById('content');
  let html = `<div class="day-group"><div class="day-header">Today — ${todayStr}</div>`;
  if (!todayDay || !todayDay.entries.length) {
    html += `<div class="empty-state">No entries yet today.<br>Tap + to add one.</div>`;
  } else {
    [...todayDay.entries].reverse().forEach(entry => {
      html += `<div class="entry-card" onclick="openEntry('${esc(todayDay.date)}','${esc(entry.time)}')">`;
      html += `<div class="entry-time">${entry.time}</div>`;
      if (entry.summary) html += `<div class="entry-summary">${esc(entry.summary)}</div>`;
      if (entry.body) html += `<div class="entry-body">${esc(entry.body)}</div>`;
      html += `<div class="entry-meta">`;
      entry.mood.forEach(m => html += `<span class="meta-pill mood-pill">${esc(m)}</span>`);
      entry.themes.forEach(t => html += `<span class="meta-pill theme-pill">${esc(t)}</span>`);
      if (entry.energy) html += `<span class="meta-pill energy-pill">⚡ ${entry.energy}/10</span>`;
      html += `</div></div>`;
    });
  }
  html += `</div>`;
  content.innerHTML = html;
}

function renderInsights() {
  const allEntries = parsedEntries.flatMap(d => d.entries);
  const entryCount = allEntries.length;
  const dayCount = parsedEntries.filter(d => d.entries.length > 0).length;

  // Mood frequency
  const moodFreq = {};
  allEntries.forEach(e => e.mood.forEach(m => { moodFreq[m] = (moodFreq[m] || 0) + 1; }));
  const topMoods = Object.entries(moodFreq).sort((a,b) => b[1]-a[1]).slice(0,6);
  const maxMood = topMoods[0] ? topMoods[0][1] : 1;

  // Theme frequency
  const themeFreq = {};
  allEntries.forEach(e => e.themes.forEach(t => { themeFreq[t] = (themeFreq[t] || 0) + 1; }));
  const topThemes = Object.entries(themeFreq).sort((a,b) => b[1]-a[1]).slice(0,12);

  // Average energy
  const energyEntries = allEntries.filter(e => e.energy);
  const avgEnergy = energyEntries.length ? (energyEntries.reduce((s,e) => s+e.energy, 0) / energyEntries.length).toFixed(1) : '--';

  // Energy over days (for chart)
  const energyByDay = parsedEntries.map(d => {
    const es = d.entries.filter(e => e.energy);
    if (!es.length) return null;
    return { date: d.date.split(', ')[1], val: es.reduce((s,e) => s+e.energy,0)/es.length };
  }).filter(Boolean).slice(-14);

  // Streak: consecutive days with entries (from today backwards)
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 30; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const label = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    if (parsedEntries.find(p => p.date === label && p.entries.length)) streak++;
    else if (i > 0) break;
  }

  // Last 30 days activity dots
  const dots = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const label = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    dots.push(!!parsedEntries.find(p => p.date === label && p.entries.length));
  }

  let html = '<div class="insights-section">';

  // Stats
  html += `<div class="insight-card">
    <h3>This Month</h3>
    <div class="stat-row">
      <div class="stat-box"><div class="label">Entries</div><div class="value">${entryCount}</div></div>
      <div class="stat-box"><div class="label">Days journaled</div><div class="value">${dayCount}</div></div>
      <div class="stat-box"><div class="label">Avg energy</div><div class="value">${avgEnergy}</div></div>
      <div class="stat-box"><div class="label">Day streak</div><div class="value">${streak}</div></div>
    </div>
  </div>`;

  // 30-day activity
  html += `<div class="insight-card"><h3>30-Day Activity</h3>
    <div class="streak-row">${dots.map(f => `<div class="streak-dot ${f?'filled':''}"></div>`).join('')}</div>
    <p style="font-size:11px;color:var(--text3);margin-top:8px">● = entry logged that day</p>
  </div>`;

  // Mood chart
  if (topMoods.length) {
    html += `<div class="insight-card"><h3>Mood frequency</h3>`;
    topMoods.forEach(([mood, count]) => {
      const pct = Math.round((count / maxMood) * 100);
      html += `<div class="mood-bar-row">
        <div class="mood-bar-label">${esc(mood)}</div>
        <div class="mood-bar-track"><div class="mood-bar-fill" style="width:${pct}%"></div></div>
        <div class="mood-bar-count">${count}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // Energy chart
  if (energyByDay.length > 1) {
    html += `<div class="insight-card"><h3>Energy trend</h3>
      <div class="energy-chart-wrap"><canvas id="energy-chart" role="img" aria-label="Energy levels over time">Energy over ${energyByDay.length} days</canvas></div>
    </div>`;
  }

  // Themes
  if (topThemes.length) {
    html += `<div class="insight-card"><h3>Top themes</h3><div class="theme-tags">`;
    topThemes.forEach(([t, c]) => {
      const size = c > 2 ? '14px' : '12px';
      html += `<span class="theme-tag" style="font-size:${size}">${esc(t)} <span style="opacity:0.6">${c}</span></span>`;
    });
    html += `</div></div>`;
  }

  // People
  const peopleFreq = {};
  allEntries.forEach(e => e.people.forEach(p => { peopleFreq[p] = (peopleFreq[p] || 0) + 1; }));
  const topPeople = Object.entries(peopleFreq).sort((a,b) => b[1]-a[1]).slice(0,8);
  if (topPeople.length) {
    html += `<div class="insight-card"><h3>People mentioned</h3><div class="theme-tags">`;
    topPeople.forEach(([p, c]) => {
      html += `<span class="theme-tag" style="background:#E6F1FB;color:#185FA5">${esc(p)} <span style="opacity:0.6">${c}</span></span>`;
    });
    html += `</div></div>`;
  }

  html += '</div>';
  document.getElementById('content').innerHTML = html;

  // Draw energy chart
  if (energyByDay.length > 1) {
    if (energyChart) { energyChart.destroy(); energyChart = null; }
    const ctx = document.getElementById('energy-chart').getContext('2d');
    energyChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: energyByDay.map(d => d.date),
        datasets: [{
          data: energyByDay.map(d => parseFloat(d.val.toFixed(1))),
          borderColor: '#1C1C1E', borderWidth: 2,
          pointBackgroundColor: '#1C1C1E', pointRadius: 3,
          fill: true, backgroundColor: 'rgba(28,28,30,0.06)', tension: 0.3
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { min: 1, max: 10, ticks: { stepSize: 3, font: { size: 11 } }, grid: { color: 'rgba(0,0,0,0.05)' } },
          x: { ticks: { font: { size: 10 }, maxRotation: 40, autoSkip: true, maxTicksLimit: 7 }, grid: { display: false } }
        }
      }
    });
  }
}

// ─── Entry View ───────────────────────────────────────────────────────────────
function openEntry(dateStr, timeStr) {
  const day = parsedEntries.find(d => d.date === dateStr);
  if (!day) return;
  const entry = day.entries.find(e => e.time === timeStr);
  if (!entry) return;

  document.getElementById('ev-title').textContent = timeStr;
  let html = '';
  if (entry.summary) html += `<div class="ev-summary">${esc(entry.summary)}</div>`;
  html += `<div class="ev-meta-row">`;
  entry.mood.forEach(m => html += `<span class="meta-pill mood-pill">${esc(m)}</span>`);
  entry.themes.forEach(t => html += `<span class="meta-pill theme-pill">${esc(t)}</span>`);
  if (entry.energy) html += `<span class="meta-pill energy-pill">⚡ ${entry.energy}/10</span>`;
  html += `</div>`;
  if (entry.body) html += `<div class="ev-text">${esc(entry.body)}</div>`;
  if (entry.photo) {
    html += `<div style="font-size:13px;color:var(--text3);margin-top:16px">Loading photo…</div>`;
  }
  document.getElementById('ev-body').innerHTML = html;
  document.getElementById('entry-view').classList.add('open');

  // Load photo async
  if (entry.photo) {
    const photoPath = entry.photo.startsWith('Photos/')
      ? `${CONFIG.JOURNAL_BASE}/${entry.photo}`
      : `${CONFIG.PHOTOS_FOLDER}/${entry.photo}`;
    fetchImageBlob(photoPath).then(url => {
      if (!url) return;
      const div = document.getElementById('ev-body');
      const last = div.lastElementChild;
      if (last && last.textContent === 'Loading photo…') last.remove();
      const img = document.createElement('img');
      img.src = url; img.className = 'ev-photo'; img.alt = 'Journal photo';
      div.appendChild(img);
    });
  }
}

function closeEntryView() {
  document.getElementById('entry-view').classList.remove('open');
}

// ─── Write Entry ──────────────────────────────────────────────────────────────
function openWrite() {
  const now = new Date();
  document.getElementById('write-date-label').textContent =
    now.toLocaleDateString('en-US', { month:'short', day:'numeric' }) + ' · ' +
    now.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });

  // Build mood grid
  const grid = document.getElementById('mood-grid');
  grid.innerHTML = MOODS.map(m =>
    `<button class="mood-chip" onclick="toggleMood(this,'${m}')">${m}</button>`
  ).join('');

  document.getElementById('w-summary').value = '';
  document.getElementById('w-body').value = '';
  document.getElementById('w-themes').value = '';
  document.getElementById('w-people').value = '';
  document.getElementById('w-energy').value = 7;
  document.getElementById('energy-display').textContent = '7';
  document.getElementById('photo-preview').classList.add('hidden');
  document.getElementById('photo-status').style.display = 'none';
  selectedFile = null; uploadedPhotoPath = null;

  document.getElementById('write-screen').classList.add('open');
  setTimeout(() => document.getElementById('w-summary').focus(), 300);
}

function closeWrite() {
  document.getElementById('write-screen').classList.remove('open');
}

function toggleMood(btn, mood) {
  btn.classList.toggle('selected');
}

function handlePhotoSelect(input) {
  const file = input.files[0];
  if (!file) return;
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('photo-preview');
    img.src = e.target.result;
    img.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
  document.getElementById('photo-status').style.display = 'block';
  document.getElementById('photo-status').textContent = 'Photo ready to upload with entry';
}

async function saveEntry() {
  const summary = document.getElementById('w-summary').value.trim();
  const body = document.getElementById('w-body').value.trim();
  if (!summary && !body) {
    alert('Please add a summary or some text before saving.');
    return;
  }

  const selectedMoods = [...document.querySelectorAll('.mood-chip.selected')].map(b => b.textContent);
  const energy = document.getElementById('w-energy').value;
  const themes = document.getElementById('w-themes').value.split(',').map(t => t.trim()).filter(Boolean);
  const people = document.getElementById('w-people').value.split(',').map(p => p.trim()).filter(Boolean);

  const now = new Date();
  const timeStr = now.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  const dateStr = now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });

  // Upload photo first if selected
  let photoFilename = null;
  if (selectedFile) {
    const photoStatus = document.getElementById('photo-status');
    photoStatus.textContent = 'Uploading photo…';
    try {
      const mm = String(now.getMonth()+1).padStart(2,'0');
      const dd = String(now.getDate()).padStart(2,'0');
      const ext = selectedFile.name.split('.').pop() || 'jpg';
      photoFilename = `${now.getFullYear()}-${mm}-${dd}-${Date.now()}.${ext}`;
      const buf = await selectedFile.arrayBuffer();
      await uploadBinaryFile(`${CONFIG.PHOTOS_FOLDER}/${photoFilename}`, buf, selectedFile.type || 'image/jpeg');
      photoStatus.textContent = '✓ Photo uploaded';
    } catch(e) {
      photoStatus.textContent = 'Photo upload failed: ' + e.message;
      photoFilename = null;
    }
  }

  // Build entry markdown
  let entryMd = `\n### ${timeStr}\n\n`;
  if (summary) entryMd += `**Summary:** ${summary}\n`;
  if (selectedMoods.length) entryMd += `**Mood:** ${selectedMoods.join(', ')}\n`;
  entryMd += `**Energy:** ${energy}/10\n`;
  if (themes.length) entryMd += `**Themes:** ${themes.join(', ')}\n`;
  if (people.length) entryMd += `**People:** ${people.join(', ')}\n`;
  if (body) entryMd += `\n${body}\n`;
  if (photoFilename) entryMd += `\n![photo](Photos/${photoFilename})\n`;
  entryMd += `\n---\n`;

  // Read existing file, inject entry under today's day header or append new day
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  let raw = await readFile(journalPath(year, month));
  const mm = String(month).padStart(2,'0');
  if (!raw) {
    raw = `# Journal — ${now.toLocaleString('en-US',{month:'long'})} ${year}\n\n---\n`;
  }

  const dayHeader = `## ${dateStr}`;
  const dayIdx = raw.indexOf(dayHeader);
  if (dayIdx !== -1) {
    // Insert after the day header line
    const insertAt = raw.indexOf('\n', dayIdx) + 1;
    raw = raw.slice(0, insertAt) + entryMd + raw.slice(insertAt);
  } else {
    // Append new day at end
    raw = raw.trimEnd() + `\n\n${dayHeader}\n${entryMd}`;
  }

  await writeFile(journalPath(year, month), raw);
  closeWrite();

  // Reload the current month if it matches
  if (currentYear === year && currentMonth === month) {
    await loadMonth(year, month);
  }
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function prevMonth() {
  let m = currentMonth - 1, y = currentYear;
  if (m < 1) { m = 12; y--; }
  loadMonth(y, m);
}
function nextMonth() {
  let m = currentMonth + 1, y = currentYear;
  if (m > 12) { m = 1; y++; }
  loadMonth(y, m);
}

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  const monthNav = document.getElementById('month-nav');
  monthNav.style.display = (tab === 'today') ? 'none' : 'flex';
  document.getElementById('tab-title').textContent = tab === 'today' ? 'Today' : tab === 'insights' ? 'Insights' : 'Journal';
  render();
}

// ─── Utility ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
async function initApp() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');

  if (error) {
    showError('Sign-in error: ' + (params.get('error_description') || error));
    window.history.replaceState({}, '', getRedirectUri());
    return;
  }
  if (code) {
    try {
      await exchangeCode(code);
      window.history.replaceState({}, '', getRedirectUri());
      showApp();
      const now = new Date();
      await loadMonth(now.getFullYear(), now.getMonth() + 1);
    } catch(e) { showError('Auth failed: ' + e.message); }
    return;
  }
  if (localStorage.getItem('refresh_token')) {
    try {
      await getToken();
      showApp();
      const now = new Date();
      await loadMonth(now.getFullYear(), now.getMonth() + 1);
    } catch(e) { signOut(); }
    return;
  }
}

initApp().catch(e => showError('Startup error: ' + e.message));
</script>
